name: cf-deploy

# Ruling WA-DEPLOY-2 (replaces WA-DEPLOY-1; Ahmad 2026-11-02): ebda-whatsapp deploys from GitHub CI the same way ebda-store does. A deploy runs on every push
# to main and on workflow_dispatch (re-deploy or recover). All of the logic (account guard, "commit is on main" guard, D1 migrations, deploy, verify incl. the
# live commit, headers, webhooks and cron) is in scripts/deploy.sh; a failed verification fails the run and pages Telegram. CLOUDFLARE_API_TOKEN lives in the
# `production` environment (its secrets). A PR that edits this file, scripts/deploy.sh, verify-prod or wrangler.jsonc needs Ahmad's `deploy-change` label
# (deploy-change-label.yml, Ruling DEPLOY-PARITY-1), because the Free plan has no environment protection. No local `scripts/deploy.sh` or build from the Mac (MAC-LIGHT-1).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway (a cancelled deploy is a half-migrated production).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Migrate, deploy, verify
    # Only the main branch deploys: a workflow_dispatch from any other branch is skipped (WA-DEPLOY-2 interim hardening).
    if: github.ref == 'refs/heads/main'
    # The secrets live on the `production` environment.
    environment: production
    # Pinned in YAML, never through a repo variable (Ruling RUNS-ON-NEVER-1): ubuntu-latest moved to 26.04 and broke Playwright installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/deploy.sh proves the commit is an ancestor of origin/main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # No lifecycle scripts, and no secret in the environment of anything that runs repo or dependency code except wrangler itself (the Deploy step).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Build the web app (assets)
        run: npm run build:web
      - name: Deploy (guards, D1 migrations, deploy, verify)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=No Cloudflare token::CLOUDFLARE_API_TOKEN is not set. Add it to the production environment secrets (Ruling WA-DEPLOY-2)."
            exit 1
          fi
          bash scripts/deploy.sh
      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # The text carries the commit and the run link only: no phone, no secret, no message content.
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_ALERT_CHAT_ID}" ]; then
            echo "::warning title=No Telegram secrets::the deploy failed but TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID are not set, so nobody was messaged."
            exit 0
          fi
          curl -sS --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode "text=🔴 Ebda Chat: deploy FAILED at ${SHORT_SHA:0:7}. Production may be half-migrated or unverified: ${RUN_URL}" >/dev/null || true
