name: Deploy change label
# Ruling DEPLOY-PARITY-1: no environment protection exists on this plan, so a PR that edits a deploy workflow (or the deploy
# guard / secret list) must carry the `deploy-change` label, applied by a human after reading the diff. Re-runs when the label
# is added or removed. Needs no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: deploy-change-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-label:
    name: Deploy workflow changes need the deploy-change label
    # Mac pool (never a hosted runner, Ahmad 2026-11-16; a label check pinned to hosted failed in 2 s once the org had no hosted minutes, PR #52).
    # A fork's PR never runs on the self-hosted runner AND there is no hosted one: it asks for a label no runner has, so the job queues and the
    # required check never reports (fail closed: the PR cannot merge, fork code never runs here). A skipped required check would pass.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '["ebda-mac-light"]') || 'fork-pr-no-runner' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Require the deploy-change label when deploy files change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci/deploy-change-label.mjs --base "$BASE_SHA" --labels "$LABELS"
