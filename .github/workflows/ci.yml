name: ci

on:
  pull_request:
  push:
    branches: [main]

# A PR push supersedes the previous run of that PR; main pushes each get their own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Typecheck, tests, audit
    # Never run code from a fork's PR on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The Mac runner pool: the repo variable EBDA_RUNS_ON (a JSON value, e.g. ["ebda-mac-light"], not a bare label), else the Mac label itself.
    # Never a GitHub-hosted runner (Ahmad 2026-11-16: no hosted minutes); test/workflow-no-hosted-runners.test.ts pins it.
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '["ebda-mac-light"]') }}
    # The full suite takes 19-27 min on the shared VM under load from other products' jobs (main run at 0976248: 19 min; PR #43 run 40840747987 was cut at 25 while still passing files).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's base history, so scripts/ci-affected.sh can diff against it (WA-CI-ON-1).
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Remote Actions cache only on hosted runners; on Umbra ~/.npm is already local.
      # Foundation drift (register row "Foundation version drift"): the vendored foundation may be one release behind, never two or
      # more for over 7 days. A GitHub read failure warns and passes (an api.github.com outage must not block every merge).
      - name: Foundation drift (vendored tag vs latest foundation tag)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/foundation-drift-check.mjs
      - run: npm ci
      - run: npm run typecheck
      # CI-only: 2 workers (the shared 4.9 GB VM ran out of memory and time with the default pool); local runs keep the default.
      # scripts/ci-test.mjs: vitest's own verdict, plus a guard for a pool that never exits after printing its summary (PR #7 run 40190537795)
      # or after every listed file reported but before the summary (main run 40217314246, PR #11 run 40222548576): per-file marks + collected
      # test counts decide; 10 min of silence fails naming unreported files. Every stop prints an alert line and a ::warning/::error annotation.
      # PR: static guards in full + only the workers/web tests the change reaches; main and any shared-input change: everything (scripts/ci-affected.sh, Ruling WA-CI-ON-1).
      - name: Tests (suite duration reported, to see creep)
        shell: bash
        env:
          # 60 s per test on the shared VM (host memory pressure stalled it for 84 s and 343 s on 2026-10-25); local runs keep 20 s.
          VITEST_TEST_TIMEOUT: '60000'
          VITEST_ASYNC_TIMEOUT: '20000'
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          start=$(date +%s)
          rc=0
          mode=$(bash scripts/ci-affected.sh)
          echo "::notice title=Test scope::${mode}"
          if [ "$mode" = full ]; then
            npm run test:ci -- --maxWorkers=2 || rc=$?  # the step runs with bash -e: capture, report the duration, then exit with it
          else
            npm run test:ci -- --project node --maxWorkers=2 || rc=$?
            if [ "$rc" -eq 0 ]; then npm run test:ci -- --project workers --project web --maxWorkers=2 --changed="origin/${BASE_REF}" --passWithNoTests || rc=$?; fi
          fi
          secs=$(( $(date +%s) - start ))
          echo "::notice title=Suite duration::${secs}s"
          echo "### Test suite (${mode}): ${secs}s" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Audit production dependencies (blocking)
        # Ruling AUDIT-SPLIT-1: `npm audit --omit=dev`, zero tolerance beyond .github/audit-allow.json (id, package, reason, expiry; an expired
        # entry fails this step). Was `npm audit --audit-level=low` over EVERY dependency: GHSA-fc5q-39xc-vjpf (picomatch ReDoS, no patched
        # version, build/test tooling only) turned every PR red.
        run: node .github/scripts/audit-gate.mjs
      - name: Report development advisories (non-blocking)
        # The same allow-list over EVERY dependency; red for an unlisted advisory, never stops a merge.
        continue-on-error: true
        run: node .github/scripts/audit-gate.mjs --all
