name: nightly

# Heavy tier, once a day (PRs run typecheck + the affected tests; main runs everything): the opt-in speed benches (BENCH=1).
# The budget is FIXED, not runner-sized (M-176): every bench measures a baseline on this same runner in this same run and
# fails when a path is slower than a fixed multiple of it (test/helpers/bench.ts), so a slow runner cannot hide a
# regression and a fast one cannot invent one. The 150 ms absolute product figure is certified only on a known machine:
# `node scripts/bench-local.mjs`.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  bench:
    name: Speed benches
    # Ruling CI-HOSTED-1 (2026-11-02): a scheduled run is a no-op unless a self-hosted runner is configured
    # (EBDA_RUNS_ON set); manual dispatch runs on the Mac pool too (never a hosted runner).
    if: (github.event_name != 'schedule' || vars.EBDA_RUNS_ON != '')
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '["ebda-mac-light"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Benches (fixed-ratio budget)
        env:
          BENCH: '1'
        run: npx vitest run test/perf.test.ts test/inbox-api.test.ts test/scale-spike.test.ts --reporter=verbose

  help-publication-lag:
    name: Help publication lag
    # Off until Ebda Store's import emits the same body bytes as the source (plan 1 task 18); then set the repo variable HELP_PUBLICATION_LAG=1.
    if: (github.event_name != 'schedule' || vars.EBDA_RUNS_ON != '') && vars.HELP_PUBLICATION_LAG == '1'
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '["ebda-mac-light"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: A guide not published within 48 hours fails
        run: node scripts/help-publication-lag.mjs
