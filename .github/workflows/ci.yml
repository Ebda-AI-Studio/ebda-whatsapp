name: ci

on:
  pull_request:
  push:
    branches: [main]

# A PR push supersedes the previous run of that PR; main pushes each get their own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Typecheck, tests, audit
    # Never run code from a fork's PR on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Umbra self-hosted runner when the repo variable EBDA_RUNS_ON is set, else GitHub-hosted.
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Remote Actions cache only on hosted runners; on Umbra ~/.npm is already local.
          cache: ${{ vars.EBDA_RUNS_ON == '' && 'npm' || '' }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=low
