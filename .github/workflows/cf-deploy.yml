name: cf-deploy

# A deploy needs a human go: this workflow runs ONLY when someone dispatches it (Actions -> cf-deploy -> Run workflow).
# It deploys the dispatched ref's commit, which must already be on main. D1 migrations first, then the code, then it proves the
# running commit and the live cron schedule. Rollback and the forward-only migration rule: docs/runbooks/rollback.md.
on:
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway (a cancelled deploy is a half-migrated production).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # The ONLY Cloudflare account this repo may deploy to (personal / Whisky 11). `wrangler whoami` also lists another account: never deploy there.
  EXPECTED_ACCOUNT_ID: 69188202efc4df480140dd76545aa3ab

jobs:
  deploy:
    name: Migrate, deploy, verify
    # Umbra self-hosted runner when the repo variable EBDA_RUNS_ON is set, else GitHub-hosted (same rule as ci.yml; a JSON value, not a bare label).
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the main-ancestry check below needs history
      - name: Guards (account, secrets, commit is on main)
        shell: bash
        run: |
          if [ "${CLOUDFLARE_ACCOUNT_ID}" != "${EXPECTED_ACCOUNT_ID}" ]; then
            echo "::error title=Wrong Cloudflare account::CLOUDFLARE_ACCOUNT_ID must be ${EXPECTED_ACCOUNT_ID} (personal / Whisky 11). Refusing to deploy."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set (Workers Scripts + D1 edit; created by Ahmad in the dashboard)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error title=Not on main::${GITHUB_SHA} is not an ancestor of origin/main. Only reviewed, merged commits are deployed."
            exit 1
          fi
          echo "SHORT_SHA=$(git rev-parse --short=7 "${GITHUB_SHA}")" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Remote Actions cache only on hosted runners; on Umbra ~/.npm is already local (it pulled 14 GB in 44 min once).
          cache: ${{ vars.EBDA_RUNS_ON == '' && 'npm' || '' }}
      - run: npm ci
      - run: npm run typecheck
      - name: Build the web app (assets)
        run: npm run build:web
      # D1 first, then the code: the new code may need the new schema, and the old code tolerates it (migrations are additive, see rollback.md).
      - name: D1 migrations (pending)
        run: npx wrangler d1 migrations list ebda-wa-platform --remote
      - name: D1 migrations (apply)
        run: npx wrangler d1 migrations apply ebda-wa-platform --remote
      - name: Deploy the Worker
        run: npx wrangler deploy --var "COMMIT_SHA:${SHORT_SHA}"
      - name: Verify production (running commit, headers, webhooks, live cron schedule)
        env:
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: node scripts/verify-prod.mjs --base https://wa.ebda.app --expect "${SHORT_SHA}" --brand ebda --cron "17 1 * * *" --worker ebda-wa
      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          # The text carries the commit and the run link only: no phone, no secret, no message content.
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_ALERT_CHAT_ID}" ]; then
            echo "::warning title=No Telegram secrets::the deploy failed but TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID are not set, so nobody was messaged."
            exit 0
          fi
          curl -sS --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode "text=🔴 Ebda WhatsApp: deploy FAILED at ${SHORT_SHA:-unknown}. Production may be half-migrated or unverified: ${RUN_URL}" >/dev/null || true
