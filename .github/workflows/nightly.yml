name: nightly

# Heavy tier, once a day (PRs run lint + typecheck + tests only): the opt-in speed benches (BENCH=1).
# On the shared CI runner a wall-clock budget measures the runner, so the nightly budget is runner-sized (10x the
# product budget of 150 ms, the runner being 7-12x slower than a quiet laptop): it catches regressions, it does not
# certify the 150 ms figure. That one is measured locally with `node scripts/bench-local.mjs`.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  bench:
    name: Speed benches
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ vars.EBDA_RUNS_ON == '' && 'npm' || '' }}
      - run: npm ci
      - name: Benches (runner-sized budget)
        env:
          BENCH: '1'
          BENCH_BUDGET_MS: '1500'
        run: npx vitest run test/perf.test.ts test/inbox-api.test.ts --reporter=verbose
